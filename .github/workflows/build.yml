name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm install

      - run: npm run build

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - run: |
          set -e
          shopt -s globstar
          for f in dist-*/**/*.exe dist-*/**/*.dmg dist-*/**/*.AppImage dist-*/**/*.zip dist-*/**/*.yml dist-*/**/*.blockmap; do
            echo "asset=$f" >> "$GITHUB_ENV"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-*/*
          generate_release_notes: true
